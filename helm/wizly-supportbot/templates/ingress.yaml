{{- if .Values.ingress.className }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wizly-supportbot-ingress
  namespace: {{ .Release.Namespace }}
  {{- if .Values.ingress.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.host .Values.ingress.clusterIssuer }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: wizly-supportbot-ingress-tls
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wizly-supportbot
                port:
                  number: 80
{{- end }}
