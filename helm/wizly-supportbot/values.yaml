image:
  repository: "superfyutilsacr.azurecr.io/wizly-supportbot"
  tag: "initial"
  pullPolicy: Always

replicaCount: 1

config:
  NODE_ENV: "production"
  DATA_DIR: "/app/data"
  APP_URL: "https://wyzly-support.tacobrain.online"
  UNREAD_REMINDER_RECIPIENT: "daniel@superfy.co"

unreadReminderCron:
  enabled: true
  schedule: "0 7 * * *"
  timeZone: "Etc/UTC"
  image: "curlimages/curl:8.5.0"
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"

ingress:
  className: "webapprouting.kubernetes.azure.com"
  host: "wyzly-support.tacobrain.online"
  clusterIssuer: "letsencrypt"

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
