services:
  wizly-supportbot:
    image: wizly-supportbot:latest
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wizly-support.rule=Host(`support.rajuan.app`)"
      - "traefik.http.routers.wizly-support.entrypoints=websecure"
      - "traefik.http.routers.wizly-support.tls=true"
      - "traefik.http.routers.wizly-support.tls.certresolver=letsencrypt"
      - "traefik.http.services.wizly-support.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"

networks:
  traefik-public:
    external: true
